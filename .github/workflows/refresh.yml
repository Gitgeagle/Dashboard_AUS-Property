name: Refresh market data

on:
  schedule:
    # 20:00 UTC on weekdays = 06:00 AEST / 07:00 AEDT. GitHub cron has no timezone
    # support, so this drifts an hour across daylight saving rather than tracking it.
    - cron: "0 20 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"      # don't re-trigger on the commit this workflow makes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install step: the fetcher is stdlib-only by design, so there is no
      # dependency that can break this job.
      - name: Fetch market data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch/main.py

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data change - nothing to commit."
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
